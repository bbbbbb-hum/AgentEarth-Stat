Name: AgentEarth-Stat.Cron
Mode: dev

Log:
  ServiceName: cron               # 日志中显示的服务名
  Mode: console                      # 日志输出方式：console / file / volume
  Encoding: json                  # 编码：plain 或 json
  Path: logs                      # 日志目录（仅 file/volume 模式生效）
  Level: info                     # 日志级别：info / error / severe
  KeepDays: 7                     # 保留天数
  StackCooldownMillis: 100        # 相同堆栈日志冷却时间（ms）
  Compress: true                  # 是否压缩
  MaxBackups: 5                   # 最大备份数量

# 数据库配置（如果需要）
DB:
  DataSource: "postgres://wcs:123@121.89.95.89:9002/agent_earth?sslmode=disable"

# 定时任务配置
Jobs:
  AvgResponseTimeJob:
    Enable: true
    Cron: "0 30 * * * ?" # 每1小时第30分执行一次