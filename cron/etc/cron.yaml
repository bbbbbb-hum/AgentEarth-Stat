Name: AgentEarth-Stat.Cron
Mode: dev

Log:
  ServiceName: agent-earth-stat               # 日志中显示的服务名
  Mode: console                   # 日志输出方式：console / file / volume
  Encoding: json                  # 编码：plain 或 json
  Path: /opt/xllogs/AgentEarthStat/                      # 日志目录（仅 file/volume 模式生效）
  Level: info                     # 日志级别：info / error / severe
  KeepDays: 7                     # 保留天数
  StackCooldownMillis: 100        # 相同堆栈日志冷却时间（ms）
  Compress: true                  # 是否压缩
  MaxBackups: 5                   # 最大备份数量

# 数据库配置（如果需要）
DB:
#  DataSource: "postgres://xxx:xxx@192.168.0.1:0000/xxxx?sslmode=disable" # pgsql连接示例
  DataSource: "postgres://postgres:123456@localhost:5432/postgres?sslmode=disable"

# 定时任务配置（6段cron表达式：秒 分 时 日 月 周）
Jobs:
  AvgResponseTimeJob:
    Enable: true
    Cron: "0 30 * * * ?" # 每1小时第30分执行一次
  SettlementJob:
    Enable: true
#    Cron: "0 0 1 * * ?" # 每天 01:00 日结核销
    Cron: "5 * * * * ?" # 每天 01:00 日结核销 测试使用,启动后第5s执行

  ExpirationDeductionJob:
    Enable: true
#    Cron: "0 0 2 * * ?" # 每天 02:00 过期扣减
    Cron: "15 * * * * ?" # 每天 02:00 过期扣减 测试使用，启动后第15s执行