Name: agent-earth-state
Host: 0.0.0.0
Port: 9007

NameSpace: local-dev # 服务部署集群命名空间

Log:
  ServiceName: agent-earth-stat               # 日志中显示的服务名
  Mode: console                      # 日志输出方式：console / file / volume
  Encoding: json                  # 编码：plain 或 json
  Path: /opt/xllogs/AgentEarthStat/                      # 日志目录（仅 file/volume 模式生效）
  Level: info                     # 日志级别：info / error / severe
  KeepDays: 7                     # 保留天数
  StackCooldownMillis: 100        # 相同堆栈日志冷却时间（ms）
  Compress: true                  # 是否压缩
  MaxBackups: 5                   # 最大备份数量

# 数据库配置（如果需要）
DB:
  DataSource: "postgres://xxx:xxx@192.168.0.1:0000/xxxx?sslmode=disable" # pgsql连接示例（可改成真实数据库连接）

# Redis配置
Redis:
  Host: "localhost:6379"  # redis 地址 (可改成真实redis地址)
  Type: node              # node: 单节点, cluster: 集群
  Pass: ""                # 密码，没有则留空
  Tls: false              # 是否启用TLS

# 定时任务配置
Jobs:
  AvgResponseTimeJob:
    Enable: true
    Cron: "0 30 * * * ?" # 每1小时第30分执行一次
  UserBalanceJob:
    Enable: true
    Cron: "0 5 * * * ?" # 每小时的第5分钟执行一次
  SettlementJob:
    Enable: true
    Cron: "0 0 1 * * ?" # 每天01:00 日结核销
  ExpirationDeductionJob:
      Enable: true
      Cron: "0 0 2 * * ?" # 每天02:00 过期扣减
