Log:
  ServiceName: agent-earth-stat               # 日志中显示的服务名
  Mode: console                   # 日志输出方式：console / file / volume
  Encoding: json                  # 编码：plain 或 json
  Path: /opt/xllogs/AgentEarthStat/                      # 日志目录（仅 file/volume 模式生效）
  Level: info                     # 日志级别：info / error / severe
  KeepDays: 7                     # 保留天数
  StackCooldownMillis: 100        # 相同堆栈日志冷却时间（ms）
  Compress: true                  # 是否压缩
  MaxBackups: 5                   # 最大备份数量

# 数据库配置（如果需要）
DB:
#  DataSource: "postgres://xxx:xxx@192.168.0.1:0000/xxxx?sslmode=disable" # pgsql连接示例
  DataSource: "postgres://postgres:123456@localhost:5432/postgres?sslmode=disable"

# Redis配置
Redis:
  Host: "localhost:6379"  # redis 地址 (可改成真实redis地址)
  Type: node              # node: 单节点, cluster: 集群
  Pass: ""                # 密码，没有则留空
  Tls: false              # 是否启用TLS

# NATS配置
Nats:
  Url: "nats://localhost:9023"   # NATS服务器地址(这个改成集群中真实地址)
  # 如果需要认证，可以添加以下配置
  # Username: ""
  # Password: ""
  # Token: ""

# JetStream消费者配置
Consumers:
  RequestLogsConsumer:
    Enable: true
    Stream: "REQUEST_LOGS"           # JetStream Stream名称
    Subject: "logs.request"         # 订阅的主题
    Durable: "stat-consumer"        # 持久化消费者名称（用于断线重连后继续消费）
    AckWait: 30                        # 消息确认超时时间（秒）
    MaxDeliver: 3                      # 消息最大重试次数
    MaxAckPending: 1000                # 最大未确认消息数

# 定时任务配置
Jobs:
  AvgResponseTimeJob:
    Enable: true
    Cron: "0 30 * * * ?" # 每1小时第30分执行一次

  SettlementJob:
    Enable: true
    Cron: "0 0 1 * * ?" # 每天 中国01:00 日结核销（UTC 17:00）
    # Cron: "5 * * * * ?" # 测试：启动后第5s执行

  ExpirationDeductionJob:
    Enable: true
    Cron: "0 0 2 * * ?" # 每天 中国02:00 过期扣减（UTC 18:00）
    # Cron: "15 * * * * ?" # 测试：启动后第15s执行

#TODO: 测试 API（Apifox 触发定时任务用，生产请关闭）
TestAPI:
  Enable: true   # 设为 true 时启动 HTTP 9090，POST /test/run-job
  Port: 9090